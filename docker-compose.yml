services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: investai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: investai
      POSTGRES_USER: investai
      POSTGRES_PASSWORD: investai_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investai -d investai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: